<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page Not Available</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#ffffff;
}

.page{
    width:100%;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.box{
    width:100%;
    max-width:420px;
    text-align:center;
}

.icon{
    width:90px;
    height:90px;
    margin:0 auto 20px;
    border-radius:50%;
    background:#f1f5f7;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:42px;
}

h1{
    font-size:26px;
    color:#526b75;
    margin-bottom:10px;
}

p{
    font-size:15px;
    line-height:1.6;
    color:#89999f;
    margin-bottom:25px;
}

button{
    border:0;
    background:#9fc3ce;
    color:white;
    padding:12px 28px;
    border-radius:8px;
    font-size:15px;
    cursor:pointer;
}

button:active{
    transform:scale(.97);
}
</style>
</head>

<body>

<div class="page">

    <div class="box">

        <div class="icon">!</div>

        <h1>Page Not Available</h1>

        <p>
            Sorry, this page is currently not available.
            Please next Update Wait ...
        </p>

        <button onclick="goHome()">Go Home</button>

    </div>

</div>

<script>
function goHome(){
    window.location.href = "home.html";
}
</script>

</body>
</html>
